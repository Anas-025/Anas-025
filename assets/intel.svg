<svg
  width="200"
  height="100"
  viewBox="0 0 200 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .box {
      fill: steelblue;
      transition: fill 0.3s ease;
    }

    .box:hover {
      fill: tomato;
    }
  </style>

  <rect
    class="box"
    x="25"
    y="25"
    width="150"
    height="50"
    rx="8"
  />
</svg>
