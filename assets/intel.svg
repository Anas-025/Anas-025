<svg
  width="400"
  height="150"
  viewBox="0 0 400 150"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .player {
      animation: move 2s ease-in-out infinite alternate;
    }

    @keyframes move {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(250px);
      }
    }
  </style>

  <circle
    class="player"
    cx="50"
    cy="75"
    r="20"
    fill="red"
  />
</svg>